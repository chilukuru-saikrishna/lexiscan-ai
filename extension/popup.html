<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 380px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 12px; background: #0d1117; color: #c9d1d9; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 8px; margin-bottom: 8px; }
    h3 { margin: 0; color: #58a6ff; font-size: 15px; }
    #status { font-size: 12px; color: #8b949e; line-height: 1.4; }
    .btn-download { width: 100%; background: #1f6feb; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; margin-top: 8px; display: none; }
    .btn-download:hover { background: #388bfd; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px; margin-top: 8px; font-size: 12px; }
    .risk-tag { background: #da3633; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    .rev-box { background: rgba(63, 185, 80, 0.15); border-left: 3px solid #3fb950; padding: 6px; margin-top: 6px; color: #7ee787; white-space: pre-wrap; }
    .orig-box { background: rgba(248, 81, 73, 0.15); border-left: 3px solid #f85149; padding: 6px; margin-top: 6px; color: #ff7b72; text-decoration: line-through; }
    .btn-accept { background: #238636; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-top: 8px; font-size: 11px; font-weight: bold; }
    .btn-accept.accepted { background: #30363d; color: #8b949e; cursor: default; }
  </style>
</head>
<body>
  <div class="header">
    <h3>🔍 Lexiscan AI</h3>
  </div>
  <div id="status">Highlight any contract clause, right-click, and select <b>Analyze Clause with Lexiscan AI</b>.</div>
  <button id="downloadBtn" class="btn-download">📥 Export Redline Review (.doc)</button>
  <div id="results"></div>
  <script src="popup.js"></script>
</body>
</html>
